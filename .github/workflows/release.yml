name: Release

# Builds every platform from a version tag and leaves a draft release with the
# five archives attached, so the notes can be written after seeing what was
# actually built. Publishing stays a manual click.
#
#   git tag v2026.1 && git push origin v2026.1
#
# The tag must match the VERSION file: a version in an artifact's name comes
# from that file, not from the tag, and the two disagreeing is worse than a
# failed build.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  check:
    name: tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          want=$(head -n 1 VERSION | tr -d ' \r\n')
          got=${GITHUB_REF_NAME#v}
          echo "VERSION: $want, tag: $got"
          [ "$want" = "$got" ] || { echo "the tag and VERSION disagree"; exit 1; }

  linux:
    needs: check
    uses: ./.github/workflows/linux.yml
    with:
      release: true

  macos:
    needs: check
    uses: ./.github/workflows/macos.yml
    with:
      release: true

  windows:
    needs: check
    uses: ./.github/workflows/windows.yml
    with:
      release: true

  publish:
    name: draft the release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # skip-decompress: every artifact here was uploaded with archive: false,
      # so what is stored is the finished file - unpacking it would give the
      # contents of a zip that is itself the thing being released
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      - env:
          GH_TOKEN: ${{ github.token }}
          # nothing is checked out here, and gh reads the repository off a git
          # remote unless it is told which one
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --verify-tag \
            --title "Xpeccy+ ${GITHUB_REF_NAME#v}" \
            --generate-notes
          echo "draft release $GITHUB_REF_NAME is ready to edit and publish" >> "$GITHUB_STEP_SUMMARY"
