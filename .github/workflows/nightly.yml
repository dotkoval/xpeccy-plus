name: Nightly

# One always-current build of main, published as a pre-release under a fixed
# "nightly" tag: the download links need no GitHub account, they do not expire
# the way workflow artifacts do, and a pre-release never takes the "Latest"
# badge away from a real release.
#
# Runs every night and stops right away when main has not moved - the nightly
# tag sits on the commit the current build was made from.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even when main has not moved'
        type: boolean
        default: false

concurrency:
  group: nightly

permissions:
  contents: read

jobs:
  check:
    name: has main moved
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.ask.outputs.build }}
    steps:
      - id: ask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || echo none)
          echo "built last time: $built"
          echo "main is now:     $GITHUB_SHA"
          if [ "${{ inputs.force }}" = "true" ] || [ "$built" != "$GITHUB_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has not moved since the last nightly" >> "$GITHUB_STEP_SUMMARY"
          fi

  linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/linux.yml

  macos:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/macos.yml

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/windows.yml

  # all three or none: a dev build missing a platform looks like the platform
  # was dropped rather than broken
  publish:
    name: publish
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          # deleted and recreated rather than edited: the tag has to move to the
          # commit that was just built
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly build" \
            --notes "Automatic build of \`main\` at ${GITHUB_SHA:0:7} ($(date -u +%Y-%m-%d)). Not a release: this is whatever main happened to be that night."
